plugins {
    id 'com.android.application'
}

android {
    namespace 'mg.ninoh.ninohcraft'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'mg.ninoh.ninohcraft'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DPLATFORM=Android', '-DANDROID_STL=c++_static'
            }
        }
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
